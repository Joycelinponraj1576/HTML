<!doctype html>
<html>
<head>
	<title>Grade Calculation</title>
</head>
<body>

<h2>Student Grade</h2>
<script>
	var marks = 90;

	if (marks >= 90) {
		document.write("Grade A");
	} else if (marks >= 75) {
		document.write("Grade B");
	} else if (marks >= 60) {
		document.write("Grade C");
	} else if (marks >= 50) {
		document.write("Grade D");
	} else {
		document.write("Fail");
	}
</script>

</body>
</html>
